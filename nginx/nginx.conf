# =============================================================================
# Main Nginx configuration (edge / reverse proxy).
#
# This file owns everything that applies to the whole process: dynamic modules,
# logging, rate-limit zones, compression, DNS resolution, and TLS defaults.
# Per-site server blocks live in nginx/templates/*-mode.conf.template and are
# rendered into conf.d/ by docker-entrypoint.d/45-site-config.sh.
# =============================================================================

# Brotli dynamic module (built in the Dockerfile; file exists only when the
# module compiled). An `include` glob that matches nothing is a silent no-op,
# so gzip-only fallback images still start.
include /etc/nginx/modules-enabled/*.conf;

# The container image runs the master process as the unprivileged `nginx` user,
# so no `user` directive and a pid path in a writable directory.
pid /tmp/nginx.pid;

worker_processes auto;

# Errors go straight to stderr -> Docker captures them in `docker logs`.
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # --- Structured access logs ------------------------------------------------
    # JSON on stdout so `docker logs`, jq and any future log shipper can parse
    # without a regex. `$request_id` is a per-request correlation id that Nginx
    # also forwards to the backend as X-Request-Id.
    log_format json_combined escape=json
        '{"time":"$time_iso8601"'
        ',"request_id":"$request_id"'
        ',"remote_addr":"$remote_addr"'
        ',"method":"$request_method"'
        ',"uri":"$uri"'
        ',"status":$status'
        ',"bytes_sent":$body_bytes_sent'
        ',"request_time":$request_time'
        ',"upstream_time":"$upstream_response_time"'
        ',"user_agent":"$http_user_agent"}';
    access_log /dev/stdout json_combined;

    # --- Docker DNS -------------------------------------------------------------
    # 127.0.0.11 is Docker's embedded DNS server. `proxy_pass` with a VARIABLE
    # (see snippets/locations-*.conf) makes nginx resolve the upstream name on
    # every request instead of at startup — without this, a backend container
    # recreated on deploy gets a new IP and nginx would keep proxying to the
    # dead one until manually reloaded. `valid=10s` bounds the cache.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- Rate limiting -----------------------------------------------------------
    # limit_req_zone must live in http{} — it allocates a shared-memory zone.
    # 10m of zone ≈ 65 000 distinct client IPs per zone.
    # We are the edge (no CDN in front), so $binary_remote_addr is the real
    # client. If a CDN is added later, switch to the real_ip module — see
    # docs/production-checklist.md.
    limit_req_zone $binary_remote_addr zone=site_limit:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_status 429;         # instead of the default 503 (which reads as an outage)
    limit_req_log_level warn;     # don't fill error logs at error level during floods

    # --- Compression -------------------------------------------------------------
    # gzip ships in the stock nginx image. Brotli directives live here but are
    # only valid when the module loaded — see the Dockerfile: the http-level
    # `brotli*` directives are written into conf.d/00-brotli.conf ONLY when the
    # module compiled, so this block stays valid either way.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;            # level 5 ≈ sweet spot: ~75% of max compression
                                  # for a fraction of the CPU of level 9
    gzip_min_length 1024;         # don't waste CPU on tiny responses
    gzip_types
        text/plain
        text/css
        text/csv
        application/json
        application/javascript
        application/xml
        application/manifest+json
        image/svg+xml;

    # Don't advertise the nginx version in headers or error pages.
    server_tokens off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # --- TLS defaults (applied to every ssl server block) -----------------------
    # TLS 1.2 kept for old clients, 1.3 preferred. The cipher list covers both
    # protocols; modern ECDHE + AEAD suites only, no CBC, no RSA key exchange.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off; # TLS 1.3: client picks; fine for our suite
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;       # forward secrecy: don't persist session keys

    # OCSP stapling: nginx fetches the certificate's revocation status once and
    # hands it to clients during the handshake — saves a client roundtrip.
    # On the dev self-signed cert this logs a harmless warning; on Let's
    # Encrypt certs it works out of the box.
    ssl_stapling on;
    ssl_stapling_verify on;

    # Everything site-specific is generated into conf.d/ by the entrypoint:
    #   00-brotli.conf          (only when the brotli module compiled)
    #   10-site.conf            (rendered template: server blocks)
    #   20-http-app.conf        (HTTP app routing: proxy or HTTPS redirect)
    include /etc/nginx/conf.d/*.conf;
}
