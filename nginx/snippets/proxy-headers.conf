# Shared proxy headers for every upstream call.
#
# WHY forward the client identity: the backend runs behind this proxy, so
# without these headers it would only ever see the Docker bridge IP.
# X-Forwarded-Proto is what lets the app distinguish http from https when it
# builds absolute URLs or sets secure cookies (future auth).
# X-Request-Id carries Nginx's per-request id so a browser request can be
# traced across Nginx access logs and backend pino logs.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
