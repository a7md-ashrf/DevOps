# TLS hardening — included only by the HTTPS (8443) server block.
# Protocol/cipher/session defaults live in the http{} block of nginx.conf;
# this file is the per-server extension point.
#
# WHY HSTS lives here rather than in security-headers.conf: both server blocks
# include security-headers.conf, but HSTS only makes sense once TLS has
# actually been negotiated. (Browsers ignore HSTS on plain HTTP anyway, so
# sending it there is harmless — we keep one policy file to avoid two
# subtly different header sets drifting apart.)
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
