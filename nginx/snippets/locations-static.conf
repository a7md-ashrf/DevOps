# Application routing — STATIC frontend mode.
# Included by both server blocks (HTTPS directly, HTTP via conf.d/http-app.inc
# when TLS redirect is disabled).
#
# WHY a VARIABLE in proxy_pass: with a plain `proxy_pass http://frontend:8080;`
# nginx resolves the hostname ONCE at startup and pins the IP forever. Compose
# gives containers new IPs on every recreate — a redeployed backend would then
# 502 until someone reloaded nginx. With `$var` + the resolver in nginx.conf,
# nginx re-resolves through Docker's DNS (cached 10s) and follows the new IP
# on its own. That is what makes `docker compose up -d` a zero-touch deploy.

location /api/ {
    # Tighter budget for the API than for the site as a whole.
    limit_req zone=api_limit burst=20 nodelay;

    set $api_upstream backend:3000;
    # No URI part after proxy_pass => the original request URI is passed
    # through unchanged (/api/tasks reaches the backend as /api/tasks).
    proxy_pass http://$api_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location / {
    set $frontend_upstream frontend:8080;
    proxy_pass http://$frontend_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
}
