# Application routing — SERVER frontend mode (Node process serves the UI).
# Same shape as locations-static.conf, with the tuning a Node origin needs.

location /api/ {
    limit_req zone=api_limit burst=20 nodelay;

    set $api_upstream backend:3000;
    proxy_pass http://$api_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;
}

location / {
    set $frontend_upstream frontend:8080;
    proxy_pass http://$frontend_upstream;
    include /etc/nginx/snippets/proxy-headers.conf;

    # Server mode is the SSR/streaming-capable path: don't buffer origin
    # responses (SSE/chunked streams must flow through as they arrive) and
    # allow a slower first byte than a static file would ever need — a future
    # server-rendered page might take 100s of ms to produce its first chunk.
    proxy_buffering off;
    proxy_read_timeout 60s;
}
