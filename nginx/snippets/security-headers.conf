# Security headers — included by BOTH server blocks (HTTP and HTTPS).
#
# WHY these live at the edge, not in the app: one owner means one set of
# headers per response. Helmet sets some of them on API responses too, but it
# deliberately skips CSP (see backend/src/app.ts) so HTML from the frontend
# always carries EXACTLY this policy.
#
# HSTS is sent even over plain HTTP: browsers ignore HSTS on http:// origins,
# but once the browser has seen it over https:// it refuses future http
# connections — sending it everywhere does no harm and helps after the first
# secure visit.

# Tell the browser not to MIME-sniff responses (drives drive-by content-type
# attacks). The modern replacement for X-XSS-Protection, which is set to "0"
# because it causes more false positives than it prevents in modern browsers.
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "0" always;

# Clickjacking: DENY is stricter than SAMEORIGIN and this app has no framed
# use case. CSP frame-ancestors below is the modern directive — both are sent
# so very old browsers still get a rule.
add_header X-Frame-Options "DENY" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

# 'unsafe-inline' for style-src: React inline style attributes and the
# CSS-in-JS escape hatch. Scripts stay strict ('self' only) — that's the
# directive that actually stops XSS payloads.

add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
