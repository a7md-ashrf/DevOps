# =============================================================================
# CI — quality gates. Runs on every PR and on pushes to main.
#
# Jobs:
#   backend  — lint, typecheck, tests (against a real PostgreSQL service
#              container; the run FAILS if any test got skipped, so a dead
#              database can never masquerade as a green build), build
#   frontend — lint, typecheck, tests, production build
#   compose  — `make validate` merges every compose combination
#              (dev/prod x static/server) plus shell syntax checks
#   images   — lints all four Dockerfiles (`docker buildx build --check`) AND
#              really builds the three Node ones, using the exact context /
#              file / target release.yml uses, so a failure inside a RUN is
#              caught on the PR instead of on main after the merge
#
# Image building/pushing lives in release.yml, gated on main being green via
# branch protection: PR -> CI required -> merge -> Release -> approve -> Deploy.
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: appdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d appdb"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 12
    env:
      # test-db-url.ts derives appdb_test from this and creates it on the fly.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/appdb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.5.0
        with:
          # NOTE: `defaults.run.working-directory` above applies to `run:` steps
          # ONLY — it does not rewrite `with:` inputs. So this path is resolved
          # from the repository root (where .nvmrc lives), not from backend/.
          # Writing `backend/.nvmrc` here is the classic silent mistake.
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Test (fails if anything was skipped)
        shell: bash
        run: |
          set -euo pipefail
          # global-setup.ts SKIPS the DB-backed suites when Postgres is
          # unreachable. That is the right behaviour locally, but in CI it
          # means a broken service container produces a green build with zero
          # integration coverage — so a skip has to be a failure here.
          #
          # We assert on vitest's JSON report rather than grepping the human
          # summary. The summary is formatted (and ANSI-colourised) output:
          #   * any change to its layout breaks the pattern, and
          #   * if anything colourises when stdout is not a TTY, the escape
          #     codes land between "| " and the number and the grep goes quiet
          #     while still exiting 0.
          # Machine-readable output cannot do either.
          #
          # `--outputFile.json=...` is vitest's per-reporter output syntax, so
          # the human summary AND the JSON report come from one test run.
          # (a non-zero vitest exit still fails the step via `set -e`.)
          npm run test -- \
            --reporter=default \
            --reporter=json \
            --outputFile.json=/tmp/vitest-backend.json

          python3 - <<'PY'
          import json, sys

          with open('/tmp/vitest-backend.json') as fh:
              report = json.load(fh)

          skipped = report['numPendingTests'] + report['numTodoTests']
          print(
              f"tests: {report['numPassedTests']} passed, "
              f"{report['numFailedTests']} failed, {skipped} skipped, "
              f"{report['numTotalTests']} total"
          )
          if skipped:
              # A test in state skip/pending is what `describe.runIf(dbReachable)`
              # produces, so this message points at the actual cause.
              print(
                  f"::error::{skipped} test(s) were skipped — the PostgreSQL "
                  "service is not reachable, so this run proves nothing.",
                  file=sys.stderr,
              )
              sys.exit(1)
          PY
      - name: Build
        run: npm run build

  frontend:
    name: frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.5.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint (ESLint + Prettier)
        run: npm run lint
      - name: Test
        run: npm run test
      - name: Build (typecheck + vite build)
        run: npm run build

  compose:
    name: compose config + shell syntax
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - name: Prepare .env
        run: cp .env.example .env
      - name: Validate every compose combination
        run: make validate
      - name: Shell syntax check
        run: |
          set -euo pipefail
          for f in infra/setup/*.sh infra/backup/*.sh infra/deploy/*.sh; do
            bash -n "$f" && echo "ok bash  $f"
          done
          sh -n nginx/docker-entrypoint.d/45-site-config.sh && echo "ok sh    nginx entrypoint"
      - name: Makefile parses (renders every documented target)
        run: make help > /dev/null && echo "ok make"

  images:
    name: dockerfiles (check + real build)
    runs-on: ubuntu-latest
    # Higher than the other jobs on purpose: the builds below are the expensive
    # part of this workflow, and cutting them off halfway wastes the whole run.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build-check every image release.yml produces
        run: |
          set -euo pipefail
          # `docker buildx build --check` runs the Dockerfile frontend's linter
          # instead of executing any layer: it parses the file, resolves the
          # requested --target stage, and reports unused stages, undefined
          # build args and secrets baked into ARGs. Seconds, not minutes.
          #
          # Cheap and broad: it covers all four images, including nginx, which
          # the real builds below skip.
          check() {
            echo "::group::$1"
            shift
            docker buildx build --check "$@" .
            echo
          }

          check "backend (target: runtime)" \
            --file backend/Dockerfile --target runtime
          check "frontend (static)" \
            --file frontend/Dockerfile.static
          check "frontend (server)" \
            --file frontend/Dockerfile.server
          check "nginx" \
            --file nginx/Dockerfile

      # ---- the part that actually executes layers -------------------------
      # WHY THIS EXISTS: `--check` above executes nothing, so it cannot see a
      # failure inside a RUN. A real one did: on 2026-09-28 release.yml failed
      # with
      #   npm error ENOTEMPTY: directory not empty,
      #   rmdir '/root/.npm/_cacache/index-v5/6e'
      # because `deps` and `runtime` are sibling stages that BuildKit builds in
      # PARALLEL, both mounted the same npm cache, and `runtime` ran
      # `npm cache clean --force` while `deps` was still writing to it. Every
      # `--check`-only gate was green while that was broken, and the failure
      # landed AFTER the merge, in the job holding `packages: write`.
      #
      # So: build the three Node images for real, with the EXACT context, file
      # and target release.yml uses — this is a rehearsal of the release build,
      # not an approximation of it. Keep the two in sync when either changes.
      #
      # nginx is deliberately NOT built here: it compiles ngx_brotli from
      # source (minutes, and it needs git + a build toolchain), and it is
      # written to degrade to gzip-only rather than fail. `--check` still
      # covers it for syntax and target errors.
      - name: Build backend (runtime) for real
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: backend
          target: runtime
          push: false # build and discard; nothing may reach a registry from a PR
          tags: ci/backend:verify
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build frontend (static) for real
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile.static
          push: false
          tags: ci/frontend-static:verify
          cache-from: type=gha,scope=frontend-static
          cache-to: type=gha,mode=max,scope=frontend-static

      - name: Build frontend (server) for real
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: frontend
          file: frontend/Dockerfile.server
          push: false
          tags: ci/frontend-server:verify
          cache-from: type=gha,scope=frontend-server
          cache-to: type=gha,mode=max,scope=frontend-server
