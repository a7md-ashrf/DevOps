# =============================================================================
# Deploy — the gated promotion to production.
#
# Triggers:
#   * workflow_run : after a successful Release on main  (the normal path)
#   * workflow_dispatch : manual deploy (image_tag input) or rollback
#     (rollback checkbox -> deploy.sh --rollback -> last known-good tag)
#
# Manual approval: this job uses GitHub Environment `production`. Configure
# required reviewers on that environment (Settings -> Environments) — the job
# sits in "Waiting" until someone clicks Approve.
#
# Required repository secrets:
#   VPS_HOST        e.g. 203.0.113.10
#   VPS_USER        e.g. deploy          (must be in the docker group)
#   VPS_SSH_KEY     private key (PEM, full body incl. BEGIN/END lines)
#   VPS_PORT        optional, default 22
#   VPS_KNOWN_HOSTS optional, from: ssh-keyscan -p 22 <host>  (recommended)
# Required repository variable (not secret):
#   VPS_DEPLOY_DIR  default /srv/devops-reference
# =============================================================================
name: Deploy

on:
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-a1b2c3d); empty = .env pin"
        required: false
        default: ""
      rollback:
        description: "Roll back to the last known-good tag"
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  actions: read # download the image-tag artifact from the Release run

# One production deploy at a time; never cancel a running one (a killed
# deploy leaves half-updated containers with no health gate result).
concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  VPS_DEPLOY_DIR: ${{ vars.VPS_DEPLOY_DIR || '/srv/devops-reference' }}

jobs:
  deploy:
    name: deploy to production
    runs-on: ubuntu-latest
    environment: production # <- manual approval gate lives here
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main')
    steps:
      # ---- resolve the image tag ------------------------------------------
      - name: Download tag from Release artifact
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          name: image-tag
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: ${{ runner.temp }}/release

      - name: Resolve IMAGE_TAG
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            TAG="$(cat "${{ runner.temp }}/release/image-tag.txt")"
          else
            TAG="${{ inputs.image_tag }}"
          fi
          echo "IMAGE_TAG=${TAG}" >> "$GITHUB_ENV"
          echo "Deploying IMAGE_TAG=${TAG:-<rollback / .env pin>}"

      # ---- secrets + ssh setup --------------------------------------------
      - name: Require VPS secrets
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$VPS_HOST" ] || [ -z "$VPS_USER" ] || [ -z "$VPS_KEY" ]; then
            echo "::error::Missing VPS_HOST / VPS_USER / VPS_SSH_KEY secrets"
            exit 1
          fi

      - name: Configure SSH
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
          VPS_KEY: ${{ secrets.VPS_SSH_KEY }}
          VPS_KNOWN_HOSTS: ${{ secrets.VPS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$VPS_KEY" > ~/.ssh/vps_key
          chmod 600 ~/.ssh/vps_key
          if [ -n "$VPS_KNOWN_HOSTS" ]; then
            printf '%s\n' "$VPS_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::VPS_KNOWN_HOSTS not set - trusting key via ssh-keyscan (TOFU). Prefer storing the output of 'ssh-keyscan <host>'."
            ssh-keyscan -p "${VPS_PORT:-22}" "$VPS_HOST" > ~/.ssh/known_hosts 2>/dev/null || true
          fi
          chmod 644 ~/.ssh/known_hosts

      # ---- the actual deploy ----------------------------------------------
      - name: Run deploy.sh on the VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set -euo pipefail
          ARGS=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.rollback }}" = "true" ]; then
            ARGS="--rollback"
          fi
          ssh -i ~/.ssh/vps_key \
              -p "${VPS_PORT:-22}" \
              -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts \
              -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" \
              "cd '$VPS_DEPLOY_DIR' && IMAGE_TAG='${IMAGE_TAG:-}' ./infra/deploy/deploy.sh $ARGS"

      # ---- failure triage (best effort, never overrides the result) -------
      - name: Collect diagnostics on failure
        if: failure()
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT }}
        run: |
          set +e
          ssh -i ~/.ssh/vps_key -p "${VPS_PORT:-22}" -o IdentitiesOnly=yes \
              -o UserKnownHostsFile=~/.ssh/known_hosts -o StrictHostKeyChecking=yes \
              "${VPS_USER}@${VPS_HOST}" "
                cd '$VPS_DEPLOY_DIR' 2>/dev/null || exit 0;
                docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml ps;
                docker compose --env-file .env -f infra/docker-compose.yml -f infra/docker-compose.prod.yml logs --tail=60
              " 2>&1 | tail -n 80

      - name: Cleanup SSH key
        if: always()
        run: rm -f ~/.ssh/vps_key
