# Origin configuration for the STATIC-mode frontend container.
#
# WHY a second nginx: static mode must not ship a Node runtime at all, yet the
# frontend still needs its own network endpoint that the edge (main nginx)
# proxies to. This config is intentionally tiny — the edge owns TLS, security
# headers, compression and rate limiting; this layer only serves files.
#
# Port 8080 (not 80): the image is nginx-unprivileged, master runs as a
# non-root user, and host port 80 is mapped to it by docker-compose anyway.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker HEALTHCHECK + compose probe target.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok";
    }

    # Vite emits content-hashed files under /assets — cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html and friends: always revalidate so a deploy is visible
    # immediately (the origin owns Cache-Control; the edge never overrides it).
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # No gzip here: the edge already compresses, and compressing twice on
    # every asset would burn CPU for zero extra bytes on the wire.
}
